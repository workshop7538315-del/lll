<title>トリマナ戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 夕暮れの作戦卓: 濃紺の卓に羊皮紙のカードと木枠を置く */
:root{color-scheme:dark;--ink:#16151f;--table:#23212e;--line:#4a4258;--paper:#f8eccb;--paper-ink:#3d2a19;--gold:#f0c060;--mana:#2a8fd0;--move:#6fd98a;--hurt:#ef6a5b;--muted:#a9a2b8;--font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
html,body{height:100%}body{background:var(--ink);color:#f1ecdf;font-family:var(--font);overflow:hidden;font-size:15px;overscroll-behavior:none}
#app{height:100%;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{min-height:42px;padding:0 20px;color:#fff6df;border-image:var(--ui-button_grey) 16 fill/14px stretch;border-style:solid;border-width:14px;padding:0 10px;text-shadow:0 1px 0 #0006;font-size:16px;line-height:1}
.btn.red{border-image-source:var(--ui-button_red)}.btn.grey{border-image-source:var(--ui-button_grey)}.btn:hover{filter:brightness(1.12)}.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.paper{color:var(--paper-ink);border-style:solid;border-width:20px;border-image:var(--ui-panel_brown) 44 fill/20px stretch}
.dark{border-style:solid;border-width:20px;border-image:var(--ui-panel_grey_dark) 44 fill/20px stretch}
.screen{height:100%;overflow:auto}
/* タイトル */
.title{display:grid;place-items:center;text-align:center;gap:14px;align-content:center;min-height:100%}
.logo{font-size:clamp(46px,9vw,92px);color:var(--gold);letter-spacing:.05em;text-shadow:0 4px 0 #6b3f12}.tag{color:var(--muted);max-width:32em;line-height:1.7}
.menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#titleCast{image-rendering:pixelated;max-width:100%}
/* キャラクリ */
.make{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;height:100%}
.pv{display:flex;flex-direction:column;gap:10px;min-width:0}.pv canvas{image-rendering:pixelated;width:100%;max-width:256px;align-self:center;background:#7ba05a33}
.rows{display:grid;gap:8px;align-content:start;overflow:auto;min-width:0}.opt{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;align-items:center}
.opt>label{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{padding:5px 9px;border:1px solid var(--line);background:#ffffff0d;min-height:32px}.chip[aria-pressed=true]{background:var(--gold);color:#2a1a0a;border-color:var(--gold)}
.sw{width:26px;height:26px;border:2px solid #0006}.sw[aria-pressed=true]{outline:2px solid var(--gold);outline-offset:1px}
.classes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cls{padding:8px;border:2px solid var(--line);background:#ffffff0a;text-align:left;line-height:1.45;font-size:13px;min-width:0}.cls[aria-pressed=true]{border-color:var(--gold);background:#f0c06026}.cls b{font-weight:400;font-size:17px;color:var(--gold)}.cls svg{width:30px;height:30px;float:right;color:var(--gold)}
input[type=text]{font:inherit;padding:7px;background:#0005;border:1px solid var(--line);color:inherit;width:100%}
/* 戦闘 */
.battle{height:100%;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,220px);grid-template-rows:minmax(0,1fr) auto;gap:8px 12px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}.boardwrap{min-height:0;min-width:0;display:grid;place-items:center;position:relative}
#bd{image-rendering:pixelated;display:block;cursor:pointer}
.hand{grid-column:1/-1;display:flex;gap:8px;align-items:flex-end;min-width:0}.cards{flex:1;display:flex;justify-content:center;gap:6px;overflow-x:auto;padding:14px 14px 2px;min-width:0;min-height:200px}
.card{flex:0 0 124px;height:182px;position:relative;padding:0;color:var(--paper-ink);border-style:solid;border-width:10px;border-image:var(--ui-panel_brown) 44 fill/10px stretch;text-align:left;transition:transform .12s;display:flex;flex-direction:column;gap:2px;font-size:11.5px;line-height:1.3}
.card:hover,.card.sel{transform:translateY(-10px)}.card.sel{filter:drop-shadow(0 0 7px var(--gold))}.card.no{filter:grayscale(.7) brightness(.72)}
.card .cost{position:absolute;left:-13px;top:-14px;width:28px;height:34px;background:var(--ui-hexagon_grey_dark) center/contain no-repeat;color:#fff;display:grid;place-items:center;font-size:16px;text-shadow:0 1px 0 #000}
.card .nm{font-size:13.5px;padding-left:14px;line-height:1.2}.card .mid{display:flex;justify-content:space-between;align-items:center;gap:2px}
.card svg{width:44px;height:44px}.card[data-t=move] svg{color:#2f8a45}.card[data-t=atk] svg{color:#b73b2c}.card[data-t=skill] svg{color:#2a71a3}
.mini{display:grid;grid-template-columns:repeat(7,7px);grid-auto-rows:7px;gap:1px;background:#3d2a1933;padding:1px}.mini i{background:#fff5}.mini i.r{background:#3b82b6}.mini i.m{background:#2f8a45}.mini i.a{background:#c7492f}.mini i.c{background:#2a1a0a}
.card .tx{font-size:11px}.tag2{position:absolute;right:0;top:0;font-size:9px;opacity:.7}
.hud{padding:6px 2px;display:grid;gap:5px}.name{font-size:17px}.dark{color:#20283a}.bar{height:15px;position:relative;background:#0007;border:1px solid #0009}.bar i{position:absolute;inset:0 auto 0 0;background:var(--hurt)}.bar span{position:absolute;inset:0;color:#fff;text-align:center;font-size:12px;line-height:13px}.bar.bl i{background:#7c8da3}
.manas{display:flex;gap:4px;align-items:center}.gem{width:30px;height:38px;background:var(--ui-hexagon_grey) center/contain no-repeat;opacity:.45;position:relative}.gem.on{opacity:1}.gem.on::after{content:"";position:absolute;inset:8px 6px;background:var(--mana);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.stat{display:flex;gap:4px;flex-wrap:wrap}.st{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:0 4px;background:#0006;color:#fff}.st svg{width:13px;height:13px}
.foe{display:flex;gap:6px;align-items:center;padding:4px;background:#ffffff0a;border:1px solid transparent}.foe.hov{border-color:var(--gold)}.foe canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}.foe>div{flex:1;min-width:0;display:grid;gap:2px}
.log{flex:1;overflow:auto;min-height:0;font-size:12.5px;color:var(--muted);line-height:1.5;padding:4px}.log p{margin:0 0 2px}
.piles{display:flex;gap:6px;font-size:12px}.piles button{padding:4px 6px;background:#ffffff12;min-height:30px}
.tip{position:fixed;z-index:30;max-width:250px;background:#0b0a12f2;border:1px solid var(--gold);padding:7px 9px;font-size:12.5px;line-height:1.5;pointer-events:none}
.bnr{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:min(380px,90%);height:90px;background:var(--ui-banner_hanging) center/100% 100% no-repeat;display:grid;place-items:center;font-size:24px;color:#fff;text-shadow:0 2px 0 #0007;animation:bn 1s both;pointer-events:none}
@keyframes bn{0%{opacity:0;margin-top:-12px}20%,75%{opacity:1;margin-top:0}100%{opacity:0}}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px}.mbox{max-width:900px;width:100%;max-height:92%;overflow:auto}
.gridc{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:12px}.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.credit{font-size:13px;line-height:1.7;overflow-wrap:anywhere}.credit a{color:#2a71a3}
.rw{display:grid;gap:14px;align-content:center;min-height:100%;justify-items:center;text-align:center}.rw h2{font-size:32px;color:var(--gold)}
.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;gap:8px}
#info,.tabs,.gtxt{display:none}
@media (max-width:860px) and (orientation:portrait),(max-height:520px) and (orientation:landscape){
#app{padding-block:4px}
.btn{min-height:34px;border-width:9px;border-image-width:9px;font-size:13px;padding:0 3px;white-space:nowrap}
.chip{padding:3px 7px;min-height:28px;font-size:12px}
.battle{gap:4px 8px}.battle .side{display:contents}#log,.sp{display:none}
#hhud{grid-area:hud;border:0;border-image:none;background:#2c2a38;color:#fff;padding:4px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 6px;align-items:center}
#hhud>.hd{display:contents!important}#hhud .name,#hhud .bar.bl{display:none}#hhud #pf{width:34px!important;height:34px!important;grid-row:1/3}
.bar{height:12px}.bar span{font-size:10px;line-height:10px}.manas{gap:2px;flex-wrap:nowrap;min-width:0}.gem{width:17px;height:21px}.gem.on::after{inset:5px 3px}.manas>span{font-size:12px!important;color:#9fd8ff!important}.gtxt{display:inline;font-size:11px;color:#dfe8f2;white-space:nowrap}.manas .stat{flex-wrap:nowrap}
.st{font-size:10px;padding:0 2px}.st svg{width:10px;height:10px}
.topline{grid-area:top;font-size:11px;flex-direction:column;gap:0;text-align:right;line-height:1.25}.bm{grid-area:bm;flex-wrap:nowrap;gap:4px;justify-content:flex-end}
#foes{grid-area:foes;display:flex!important;gap:3px;overflow:hidden!important}.foe{flex:1 1 0;min-width:0;gap:3px;padding:2px}.foe canvas{width:26px;height:26px}.foe>div>span:first-child{display:none}.foe .bar{height:11px}.foe .stat{flex-wrap:nowrap;overflow:hidden;min-height:12px}
.boardwrap{grid-area:board}.hand{grid-area:hand;flex-direction:column;align-items:stretch;gap:2px;min-height:0}
.ctl{order:-1;display:flex!important;align-items:center;gap:4px;min-width:0}.ctl .piles{flex:none;gap:3px;font-size:10px}.ctl .piles button{padding:2px 3px;min-height:34px;line-height:1.1}
#info{display:block;flex:1;min-width:0;height:42px;overflow:hidden;font-size:11px;line-height:14px;color:#f1ecdf}
.battle .cards{justify-content:stretch;overflow:visible;padding:11px 1px 0 8px;gap:3px;min-height:0}
.battle .card{flex:1 1 0;min-width:0;height:108px;border-width:6px;border-image-width:6px;align-items:center;justify-content:flex-start;gap:1px}
.battle .card:hover{transform:none}.battle .card.sel{transform:translateY(-6px)}
.battle .card .tx{display:none}.battle .card .nm{font-size:10.5px;line-height:1.1;padding-left:10px;min-height:23px;align-self:flex-start}.battle .card .mid,.modal .card .mid{flex-direction:column;gap:1px}.battle .card svg{width:21px;height:21px}
.card .cost{left:-10px;top:-11px;width:20px;height:24px;font-size:12px}
.battle .mini,.modal .mini{grid-template-columns:repeat(7,minmax(0,5px));grid-auto-rows:5px;padding:1px}
/* キャラクリ */
.make{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;gap:6px}
.pv{display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-areas:"cv rot" "cv nm" "cv act";gap:4px 8px;align-items:center}.pv h2{display:none}.pv canvas{grid-area:cv;width:116px}.pv .rot{grid-area:rot;flex-wrap:nowrap}.pv .opt{grid-area:nm;grid-template-columns:3em minmax(0,1fr)}.pv input{padding:4px}.pv .act{grid-area:act;flex-wrap:nowrap;gap:4px}.pv .act .btn{flex:1 1 0;min-width:0}
.rows{grid-template-rows:auto minmax(0,1fr);gap:6px;overflow:hidden}.tabs{display:flex;gap:3px}.tabs button{flex:1 1 0;min-width:0;min-height:34px;padding:0;border:1px solid var(--line);font-size:13px}.tabs button[aria-pressed=true]{background:var(--gold);color:#2a1a0a}
.panel{display:block;min-height:0}.grp{display:none;gap:7px;align-content:start}.grp.on{display:grid}.classes{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.cls{padding:5px 6px;font-size:12px;line-height:1.3}.cls b{font-size:15px}.cls svg{width:22px;height:22px}.opt{grid-template-columns:3.6em minmax(0,1fr);gap:4px;font-size:12px}.chips{gap:3px}.sw{width:27px;height:27px}
/* その他 */
#titleCast{width:auto;height:90px}.title{gap:6px}.logo{font-size:clamp(38px,12vw,60px)}.tag{font-size:13px;margin:0;line-height:1.5}
.rw{gap:6px}.rw h2{font-size:22px}.rw p{margin:0;font-size:13px}.rw .gridc{flex-wrap:nowrap;width:100%;padding:12px 0 4px 8px;gap:8px}.rw .card{flex:1 1 0;min-width:0;height:auto;min-height:176px;border-width:7px;border-image-width:7px;font-size:10px}.rw .card .nm{font-size:12px}.rw .card .tx{font-size:10.5px}.rw .card .mid svg{width:30px;height:30px}
.modal{padding:4px}.modal .dark{border-width:8px;border-image-width:8px}.modal h2{font-size:15px}.modal .gridc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px 5px;padding:10px 0 0 8px}.modal .card{height:82px;border-width:5px;border-image-width:5px;align-items:center}.modal .card .tx,.modal .card svg{display:none}.modal .card .nm{font-size:9.5px;line-height:1.1;padding-left:9px;align-self:flex-start;min-height:21px}.mbox{max-height:100%}.modal .foot{padding-top:4px}.paper.credit{font-size:11px}
}
@media (max-width:860px) and (orientation:portrait){
.battle{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"hud top" "hud bm" "foes foes" "board board" "hand hand"}
}
@media (max-height:520px) and (orientation:landscape){
.battle{grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(250px,40%);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"hud board hand" "foes board hand" ". board hand" "top board hand"}
#foes{flex-direction:column}.foe{flex:none}.topline{flex-direction:row;text-align:left;justify-content:space-between}
.bm{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:32px;justify-content:flex-start}
.battle .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:9px;align-content:start}.battle .card{height:96px}.hand{justify-content:flex-start}#info{height:42px}
.make{grid-template-columns:minmax(0,390px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.pv{align-content:start}
#titleCast{height:70px}.logo{font-size:38px}.modal .gridc{grid-template-columns:repeat(8,minmax(0,1fr))}.rw .card{min-height:150px}
}
@media(prefers-reduced-motion:reduce){.card{transition:none}.bnr{animation-duration:.01s}}
</style>
<div id="app"></div><div id="tip" class="tip" hidden></div>
